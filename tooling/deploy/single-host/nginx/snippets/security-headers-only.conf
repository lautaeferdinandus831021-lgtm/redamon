# WhiteHat security headers ONLY (no location blocks).
#
# Split out of security-headers.conf because nginx REFUSES a `location` nested
# inside a `location`, and that file ends with two `location ~` blocks:
#
#   nginx: [emerg] location "/\." cannot be inside the exact location
#          "/api/mcp-server"
#
# Any per-location block needing these headers includes THIS file instead. That
# matters because a location carrying ANY add_header stops inheriting the
# server-level ones: it gets none of them unless it re-states the whole set.
# Hand-copying the list is exactly what let the login block drift (it lost
# Permissions-Policy, COOP and CORP); one shared file means that cannot recur.
#
# HSTS and CSP are deliberately NOT here: HSTS is https-only and CSP carries a
# per-host connect-src token, so the templates emit those themselves.
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
