# WhiteHat common security headers (mode-independent, server scope).
# Installed to /etc/nginx/snippets/whitehat-security-headers.conf and `include`d by both
# the https and http server templates. HSTS + CSP are added by the templates themselves
# (HSTS is https-only; CSP carries a per-host connect-src token).
#
# The webapp (Next.js) sets NO security headers of its own, so every header here is the
# authoritative one for the whole app.
#
# The header LIST now lives in security-headers-only.conf, so a per-location
# block (which cannot include this file -- it contains `location` directives)
# can re-state the identical set without hand-copying it.
include /etc/nginx/snippets/whitehat-security-headers-only.conf;

# Block hidden/sensitive files defensively (never served by the app anyway).
location ~ /\. { deny all; return 404; }
location ~ \.(env|pem|key|crt|sql|bak|old|swp|git)$ { deny all; return 404; }
