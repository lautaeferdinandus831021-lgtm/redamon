services:
  vhost-target:
    build: .
    image: whitehat-vhost-target:latest
    container_name: whitehat-vhost-target
    networks:
      - vhostlab
    healthcheck:
      # Asks for the hidden vhost by name: a plain / would answer 404 by design
      # and look unhealthy, and this also proves Host routing is live.
      test: ["CMD-SHELL", "wget -qO- --header='Host: admin.vhostlab.test' http://127.0.0.1/ | grep -q 'Internal Admin Console'"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  # Named so the scanner container can be attached to the same bridge and reach
  # the lab by its container IP, the way the recon pipeline addresses a target.
  vhostlab:
    name: whitehat-vhostlab
