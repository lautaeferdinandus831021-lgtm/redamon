# WhiteHat JS recon scope guinea pig
#
# Bring up:    docker compose up -d --build
# Bring down:  docker compose down
# Target:      http://192.88.97.10/  (+ :8080, which the scan is not told to probe)
# Outsider:    http://192.88.97.20/  (reachable, never a project target)
#
# 192.88.97.0/24 sits in the deprecated 6to4 relay prefix for the same reason as
# supply_chain_target: JS recon is Python and fetches every JS file through
# is_url_safe_to_probe(), which rejects loopback, RFC1918 and every TEST-NET
# range. Python reports 192.88.x.x as global, so the SSRF guard stays on and
# still lets the fetch through. The recon container runs network_mode: host
# and reaches the lab over the local bridge route; nothing leaves the host.

services:

  js-scope-target:
    build: .
    image: whitehat-js-scope-target:latest
    container_name: whitehat-js-scope-target
    restart: unless-stopped
    environment:
      ROLE: target
      PORTS: "80,8080"
    mem_limit: 128m
    pids_limit: 128
    cpus: 0.5
    volumes:
      - ./server.py:/app/server.py:ro
      - ./static:/app/static:ro
    networks:
      js_scope_lab:
        ipv4_address: 192.88.97.10

  js-scope-outsider:
    image: whitehat-js-scope-target:latest
    container_name: whitehat-js-scope-outsider
    restart: unless-stopped
    depends_on:
      - js-scope-target
    environment:
      ROLE: outsider
      PORTS: "80"
    mem_limit: 64m
    pids_limit: 64
    cpus: 0.25
    volumes:
      - ./server.py:/app/server.py:ro
    networks:
      js_scope_lab:
        ipv4_address: 192.88.97.20

networks:
  js_scope_lab:
    name: whitehat_js_scope_lab
    driver: bridge
    ipam:
      config:
        - subnet: 192.88.97.0/24
          gateway: 192.88.97.1
