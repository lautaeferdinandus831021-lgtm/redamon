services:
  postgres:
    image: postgres:16-alpine
    container_name: whitehat-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whitehat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whitehat_secret}
      POSTGRES_DB: ${POSTGRES_DB:-whitehat}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whitehat} -d ${POSTGRES_DB:-whitehat}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
