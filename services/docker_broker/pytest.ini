[pytest]
# Docker-broker test root (whitehat-docker-broker). Test files sit at the top
# level (test_policy.py, test_ownership.py, ...). See docs/readmes/README.TESTING.md.
pythonpath = .
testpaths = .
asyncio_mode = auto
addopts =
    -ra
    --tb=short
    --strict-markers
    -p no:cacheprovider
markers =
    unit: fast hermetic unit test — the default gate tier (must be 100% green)
    integration: needs cross-layer wiring or heavier deps; run in the section image
    live: needs a running stack/service; self-skips cleanly when it is absent
    slow: long-running test (opt-in)
    asyncio: pytest-asyncio coroutine test
