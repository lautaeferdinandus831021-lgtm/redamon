# The unit gate from the repo ruleset (AGENTS.md QA checklist, and
# docs/readmes/README.TESTING.md): every section's tests run INSIDE its own
# image, each test file isolated in its own pytest subprocess. This job runs the
# canonical entry point exactly as documented, `./whitehat.sh test unit`, with no
# tier or skip overrides - webapp vitest and the shell suites included.
#
# It is ONE job rather than a matrix of sections because the gate does not offer
# a way to run "just one section":
#
#   * `cmd_test` resolves each section by IMAGE TAG and treats a missing image as
#     a FAILURE ("a suite that never ran proves nothing"), so the images have to
#     be built first - they are not pulled from anywhere.
#   * The unit tier also bundles the host suites (shell + webapp), and the gate
#     guard suite asserts that a missing webapp is a failure, not a skip. So
#     WHITEHAT_TEST_ALLOW_MISSING cannot be used to carve out a single-section leg
#     without breaking that guard (tests/whitehat_gate_unskippable_test.sh).
#
# The runner has ~106 GB free, which fits all six images. The section list is
# READ FROM whitehat.sh (`_TEST_SECTIONS`), never duplicated here, so a section
# that is added or renamed cannot silently drop out of CI: the plan job fails
# loudly if the block cannot be parsed, or if an entry yields no usable
# name/image/service.
name: tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same PR cancels the previous run: the gate is
  # deterministic, so a superseded run tells you nothing.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The gate looks sections up by tag (whitehat-agent, whitehat-recon, ...), and
  # compose only produces those tags when the project is named whitehat - the
  # default project name is the checkout directory.
  COMPOSE_PROJECT_NAME: whitehat
  # compose VALIDATES the whole file before building any one service, and two of
  # its variables are required (`:?` rather than a default), because whitehat.sh
  # normally generates them into .env. A CI checkout has no .env, so without
  # these every `docker compose` command fails on interpolation. They are
  # placeholders: the gate runs its sections with `docker run`, not `compose up`,
  # so nothing here reaches a database.
  NEO4J_PASSWORD: ci-placeholder-not-a-secret
  POSTGRES_PASSWORD: ci-placeholder-not-a-secret

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.plan.outputs.services }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@v7

      - id: plan
        name: Derive the section images from whitehat.sh
        shell: bash
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/plan.json"
          import json
          import pathlib
          import re
          import sys

          text = pathlib.Path("whitehat.sh").read_text(encoding="utf-8")
          block = re.search(r"^_TEST_SECTIONS=\(\n(.*?)^\)\n", text, re.S | re.M)
          if not block:
              sys.exit("could not find the _TEST_SECTIONS block in whitehat.sh")

          entries = [line.strip() for line in block.group(1).splitlines() if line.strip()]
          if not entries:
              sys.exit("_TEST_SECTIONS parsed to zero entries")

          sections = []
          for entry in entries:
              fields = entry.strip('"').split("|")
              if len(fields) < 7:
                  sys.exit(f"unexpected section spec ({len(fields)} fields): {entry}")
              name, image = fields[0], fields[1]
              if not name or not image.startswith("whitehat-"):
                  sys.exit(f"unexpected section spec: {entry}")
              # whitehat-<service>:latest -> <service>: every section image is
              # built by the compose service of that name.
              sections.append(
                  {
                      "section": name,
                      "image": image,
                      "service": image.split(":")[0].replace("whitehat-", "", 1),
                  }
              )

          # root-agent shares the agent image, so dedupe by service.
          services = []
          for entry in sections:
              if entry["service"] not in services:
                  services.append(entry["service"])

          print(json.dumps({"sections": sections, "services": services}))
          PY
          if [[ ! -s "$RUNNER_TEMP/plan.json" ]]; then
            echo "::error::could not derive the section images from whitehat.sh"
            exit 1
          fi

          echo "sections: $(python3 -c 'import json;print(", ".join(e["section"] for e in json.load(open("'$RUNNER_TEMP'/plan.json"))["sections"]))')"
          services="$(python3 -c 'import json;print(" ".join(json.load(open("'$RUNNER_TEMP'/plan.json"))["services"]))')"
          images="$(python3 -c 'import json;print(" ".join("whitehat-"+s+":latest" for s in json.load(open("'$RUNNER_TEMP'/plan.json"))["services"]))')"
          echo "services: $services"

          # Every derived service must exist in the compose file, or the build
          # step would fail with a less obvious error.
          for service in $services; do
            if ! grep -qE "^  ${service}:$" docker-compose.yml; then
              echo "::error::section image '$service' has no such compose service in docker-compose.yml"
              exit 1
            fi
          done

          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  unit-gate:
    name: unit gate
    needs: plan
    runs-on: ubuntu-latest
    # Building all six images (one of them installs torch and a browser) plus the
    # full unit tier is the long pole; the default 360 min is the ceiling.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - name: Show the toolchain and disk budget
        # So a future "no space left on device" or compose-version failure is
        # diagnosable from the log instead of inferred.
        run: |
          docker version
          docker compose version
          df -h /

      - uses: actions/setup-node@v7
        with:
          node-version: "22"          # webapp/package.json requires node >= 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install webapp dependencies
        # The unit tier includes webapp vitest, and the gate looks vitest up at
        # webapp/node_modules/.bin/vitest - without it the gate fails.
        working-directory: webapp
        env:
          # `npm ci` runs the package's postinstall (`prisma generate`), which
          # reads the datasource block in schema.prisma. This is a placeholder so
          # that step has something to parse; no database is contacted, and the
          # test suite is hermetic (the container gate runs it with no DB too).
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: npm ci

      - name: Build the section images
        # ${{ needs.plan.outputs.images }} is built by the services in
        # ${{ needs.plan.outputs.services }}; both come from whitehat.sh.
        #
        # COMPOSE_PARALLEL_LIMIT caps concurrent builds so the agent image's
        # builds cannot OOM a 16 GB runner.
        env:
          COMPOSE_PARALLEL_LIMIT: "2"
        run: |
          docker compose build ${{ needs.plan.outputs.services }}
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Unit gate
        # The canonical entry point, unmodified: all sections + shell suites +
        # webapp. No WHITEHAT_TEST_ALLOW_MISSING - a missing input is a failure.
        env:
          # The gate runs each test FILE in its own pytest subprocess in parallel.
          WHITEHAT_TEST_PARALLEL: "4"
        run: ./whitehat.sh test unit
