[pytest]
# Repo-root test root. Covers the root `tests/`, `supply_chain_*`, `graph_db`,
# `knowledge_base`, and `mcp` — all of which run inside the whitehat-agent image
# with the full repo mounted at the rootdir. `whitehat.sh test` invokes pytest
# per-subtree (not one sweep) so the two `tests/` packages under knowledge_base/
# and mcp/ never collide in a single collection. See docs/readmes/README.TESTING.md.
#
# NOTE: the section subtrees (agentic/, recon/, recon_orchestrator/, ...) each
# carry their own pytest.ini and are NOT collected from here.
pythonpath = .
testpaths = tests
asyncio_mode = auto
addopts =
    -ra
    --tb=short
    --strict-markers
    -p no:cacheprovider
markers =
    unit: fast hermetic unit test — the default gate tier (must be 100% green)
    integration: needs cross-layer wiring or heavier deps; run in the section image
    live: needs a running stack/service; self-skips cleanly when it is absent
    slow: long-running test (opt-in)
    asyncio: pytest-asyncio coroutine test
